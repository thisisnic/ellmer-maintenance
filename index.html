erplexity Embeddings API introduced<\/a>"],["Ollama's MLX engine now includes native DFlash and image input support for multimodal models, announced alongside the Muse Glimmer release. This may affect how ellmer handles image/vision inputs when using Ollama as a backend, if the API surface for sending images has changed.","DeepSeek-V4-Flash (deepseek-v4-flash) is now in official public beta as of 2026-07-31. Notably, it natively supports the Responses API format, which is a new API surface that ellmer may need to handle or document. Enhanced agent/tool-calling capabilities are also highlighted.","Two new robotics model endpoints were released: gemini-robotics-er-2-preview and gemini-robotics-er-2-streaming-preview. These are robotics-specific models and not relevant to ellmer's chat/tool-use scope. The gemini-robotics-er-1.6-preview model is also being deprecated and shut down on August 31, 2026, but as a robotics model this is not relevant to ellmer.","Anthropic released Claude Opus 5 on July 24, 2026, described as a step-change improvement for long-running agents with improvements in coding and professional work. ellmer may want to evaluate updating its default model references for the Opus tier to claude-opus-5 (or whatever the API model string is).","Gemini 3.6 Flash and 3.5 Flash-Lite are now generally available with stable model IDs (gemini-3.6-flash, gemini-3.5-flash-lite). Importantly, the sampling parameters temperature, top_p, and top_k are now deprecated for the latest Gemini models. ellmer may need to update default model references and handle/warn about deprecated parameters in its chat interface.","Stable versions of gemini-3.6-flash and gemini-3.5-flash-lite are now generally available. These may be candidates for updating ellmer's default Gemini model references if they supersede previously recommended models.","Anthropic announced Claude Sonnet 5 on June 30, 2026, described as delivering frontier performance across coding, agents, and professional work at scale. As a new flagship Sonnet-tier model, ellmer may need to consider updating its default model for the claude_sonnet family.","Ollama now supports the Anthropic Messages API, enabling tools like Claude Code to use local open models via Ollama. ellmer's chat_ollama may need to consider whether this new API surface affects how ellmer interacts with Ollama, though it primarily affects users routing Anthropic-compatible clients through Ollama.","Ollama introduced a new web search API, providing a free tier for individuals and higher rate limits via Ollama's cloud. ellmer may need to consider whether to expose or document this capability in its Ollama provider.","Ollama added the ability to enable or disable thinking for models that support it, giving users control over reasoning behavior. ellmer may need to expose this parameter in its Ollama chat interface.","Ollama now supports streaming responses with tool calling, enabling chat applications to stream content and call tools in real time. ellmer's Ollama integration may need to be updated to support or document this streaming tool-calling capability.","Perplexity has added a Gateway API (with routing and reliability features) and an Agent API (with tool use support) to their platform. These represent new API surfaces that ellmer's Perplexity provider may need to support, particularly the Agent API's tool-calling capabilities which are relevant to ellmer's tool-use functionality.","Perplexity now offers an Embeddings API with standard and contextualized embeddings. This is a new API surface that could be relevant if ellmer adds embedding support for the Perplexity provider."],["2026-08-10","2026-07-31","2026-07-30","2026-07-24","2026-07-21","2026-07-21","2026-06-30","2026-01-16","2025-09-24","2025-05-30","2025-05-28","unknown","unknown"]],"container":"<table class=\"display\">\n  <thead>\n    <tr>\n      <th>source<\/th>\n      <th>title<\/th>\n      <th>description<\/th>\n      <th>date<\/th>\n    <\/tr>\n <script type="application/json" data-for="htmlwidget-e6c7c105cfe8f46d3576">{"x":{"filter":"none","vertical":false,"data":[["<a target=\"_blank\" href=\"https://github.com/posit-dev/chatlas/pull/345\">Add content_document_file() and content_document_url() for text/CSV/code file inputs<\/a>","<a target=\"_blank\" href=\"https://github.com/posit-dev/chatlas/pull/370\">Fail loudly when a built-in tool isn't supported by the provider<\/a>","<a target=\"_blank\" href=\"https://github.com/posit-dev/chatlas/pull/363\">Fix: a tool call gets exactly one result regardless of how many content chunks the tool returns<\/a>","<a target=\"_blank\" href=\"https://github.com/posit-dev/chatlas/pull/334\">Add provider files API for uploading files once and referencing by ID<\/a>","<a target=\"_blank\" href=\"https://github.com/posit-dev/chatlas/pull/341\">ChatGoogle records built-in web search and fetch work in turns<\/a>","<a target=\"_blank\" href=\"https://github.com/posit-dev/chatlas/pull/336\">Replay built-in tool content only to the provider that produced it<\/a>"],["chatlas PR #345 added content_document_file() and content_document_url() so users can pass text, Markdown, CSV, or code files as first-class content rather than inlining file text manually. ellmer has content_pdf_file() and content_image_file() but no equivalent document content helpers; this feature does not appear in ellmer's NEWS.md, NAMESPACE, or any open issue/PR.","chatlas PR #370 made tool_web_search() and tool_web_fetch() raise a clear error when registered with a provider that doesn't support them, instead of silently sending an empty or malformed tool definition. ellmer's NEWS and NAMESPACE show no equivalent guard; open issue #913 only asks about adding Ollama search/fetch tools, not about this validation.","chatlas PR #363 fixed a bug where MCP tools returning multiple output chunks (e.g. text plus an image) caused providers like Anthropic to reject the request with a '400 each tool_use must have a single result' error. ellmer open issue #1060 covers a related contents_record() failure for mixed tool results, but neither that issue nor any listed PR addresses the multi-chunk collapsing fix for the provider request path.","chatlas PR #334 added a provider-agnostic file upload API so large PDFs or images can be uploaded once and referenced by ID in subsequent turns instead of re-sending bytes every turn. ellmer has claude_file_*() helpers for Anthropic-specific file management (exported in NAMESPACE) but no general provider files API; open issue #868 asks for this and is not yet covered by a merged or open PR.","chatlas PR #341 ensured that ChatGoogle() records what it searched for and which pages it fetched when using tool_web_search()/tool_web_fetch(), matching Anthropic and OpenAI behaviour. ellmer's open PR #1068 covers citation content broadly; however recording the search/fetch metadata in turns (not just citations) is not explicitly listed in ellmer's NEWS, NAMESPACE, or any open issue — and open issue #775 only mentions citations. Flagging as not yet covered.","chatlas PR #336 fixed cross-provider conversation replay when turns contain built-in tool content (web search/fetch), preventing invalid requests when handing off turns between providers. ellmer's NEWS and NAMESPACE show contents_record()/contents_replay() but no equivalent provider-scoped filtering of built-in tool content; no open issue or PR covers this."],["2026-07-30","2026-07-30","2026-07-30","2026-07-29","2026-07-28","2026-07-28"]],"container":"<table class=\"display\">\n  <thead>\n    <tr>\n      <th>title<\/th>\n      <th>description<\/th>\n      <th>date<\/th>\n    <\/tr>\n  <\/thead>\n<\/table>","options":{"bPaginate":false,"dom":"ftip","language":{"info":"Showing _TOTAL_ entries"},"pageLength":10,"columnDefs":[{"name":"title","targets":0},{"name":"description","targets":1},{"name":"date","targets":2}],"order":[],"autoWidth":false,"orderClasses":false}},"evals":[],"jsHooks":[]}</script>

                parent.appendChild(div);
              }
              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
